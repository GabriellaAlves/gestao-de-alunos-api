name: Testes de API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: 

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:4.4
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci
      
      - name: Iniciar a API em background (redirecionando logs)
        run: npm start > api.log 2>&1 &
        env:
          PORT: 3000
          MONGODB_URI: mongodb://127.0.0.1:27017/gestao-de-alunos-test

      - name: Aguardar API ficar online
        run: npx wait-on http-get://127.0.0.1:3000/ -t 30000

      - name: Executar Testes Automatizados e Gerar Relatório
        run: npm run test:report
        env:
          API_URL: http://127.0.0.1:3000
          ADMIN_EMAIL: admin@escola.com
          ADMIN_PASSWORD: admin123

      - name: Anexar Relatório do Mochawesome no GitHub Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-mochawesome
          path: mochawesome-report/
          
      - name: Exibir Logs da API em caso de falha
        if: failure()
        run: cat api.log
